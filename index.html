<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tokyo Family Trip Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: full-bleed street map, floating filter card top-left (bottom sheet on phones), rich popups. */
:root {
  --bg: #f4f5f6;
  --panel: #ffffff;
  --ink: #1b1d22;
  --muted: #5f6672;
  --line: #e2e4e8;
  --accent: #c8102e;          /* hinomaru red, used sparingly */
  --chip: #f0f1f4;
  --good: #1e7a46;
  --bad: #b3261e;
  --shadow: 0 8px 28px rgba(20, 24, 33, .16);
  --display: "Shippori Mincho B1", "Hiragino Mincho ProN", Georgia, serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Segoe UI", system-ui, sans-serif;

  /* category colours */
  --c-pokemon: #e0a100;
  --c-gaming: #e4002b;
  --c-amusement: #7b4ae2;
  --c-animals: #23905a;
  --c-fine: #7a1f3d;
  --c-cafe: #c06a2b;
  --c-coffee: #5e4030;
  --c-breakfast: #d9668b;
  --c-bars: #22508f;
  --c-street: #0f7b80;
  --c-select: #a21caf;
  --c-h5: #15171c;
  --c-h4: #55606b;
  --gold: #d6aa3a;
}
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--body); }
#map { position: fixed; inset: 0; background: var(--bg); }

/* ---------- filter panel ---------- */
.panel {
  position: fixed; z-index: 1000;
  top: max(14px, env(safe-area-inset-top, 0px)); left: max(14px, env(safe-area-inset-left, 0px));
  width: 290px; max-height: calc(100% - 28px); overflow: auto;
  background: var(--panel); border-radius: 14px; box-shadow: var(--shadow);
  padding: 16px 16px 12px;
}
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand h1 { font: 800 22px/1.1 var(--display); margin: 0; letter-spacing: .01em; }
.brand .jp { font: 600 13px var(--display); color: var(--accent); }
.sub { color: var(--muted); font-size: 12px; margin: 4px 0 12px; }
.group { border-top: 1px solid var(--line); padding: 10px 0 6px; }
.group-head { display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 700; font-size: 14px; }
.group-head .count { margin-left: auto; color: var(--muted); font-weight: 500; font-size: 12px; font-variant-numeric: tabular-nums; }
.subs { display: grid; gap: 2px; padding: 6px 0 2px 26px; }
.subs label { display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 3px 4px; border-radius: 6px; font-size: 13px; }
.subs label:hover { background: var(--chip); }
.subs .count { margin-left: auto; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.dot { width: 18px; height: 18px; border-radius: 50%; display: inline-grid; place-items: center; flex: none; }
.dot svg { width: 11px; height: 11px; fill: #fff; }
input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--ink); margin: 0; flex: none; }
input[type=checkbox]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.panel-foot { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 8px; color: var(--muted); font-size: 11px; }
.panel-foot button { font: inherit; font-size: 12px; background: var(--chip); color: var(--ink); border: 0; border-radius: 6px; padding: 4px 8px; cursor: pointer; }
.toggle-panel { display: none; }
.area-pick { display: grid; gap: 4px; margin-bottom: 10px; }
.area-pick label { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.area-pick select { font: 500 14px var(--body); padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); width: 100%; }
.area-pick select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.area-list { display: grid; gap: 1px; margin: -2px 0 10px; max-height: 280px; overflow: auto; border: 1px solid var(--line); border-radius: 10px; padding: 4px 6px 6px; }
.area-list h4 { margin: 8px 4px 2px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.area-list button { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; background: none; border: 0; padding: 4px; border-radius: 6px; font: 13px/1.3 var(--body); color: var(--ink); cursor: pointer; }
.area-list button:hover, .area-list button:focus-visible { background: var(--chip); outline: none; }
.area-list .empty { color: var(--muted); font-size: 12px; padding: 6px 4px; }

/* ---------- markers ---------- */
.pin { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
  border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.35); transition: transform .12s; }
.pin svg { width: 15px; height: 15px; fill: #fff; }
.pin:hover { transform: scale(1.15); }
.pin.hotel { width: 34px; height: 34px; border-radius: 9px; border-color: var(--gold); }
.pin.hotel svg { fill: var(--gold); width: 17px; height: 17px; }
.cluster { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--panel);
  font: 700 13px var(--body); border: 3px solid var(--panel); box-shadow: 0 2px 8px rgba(0,0,0,.35); font-variant-numeric: tabular-nums; }
.leaflet-cluster-anim .leaflet-marker-icon, .leaflet-cluster-anim .leaflet-marker-shadow { transition: transform .3s ease-out, opacity .3s ease-in; }
.pin.fav { box-shadow: 0 0 0 3px var(--accent), 0 2px 6px rgba(0,0,0,.35); }

/* ---------- popups ---------- */
.leaflet-popup-content-wrapper { border-radius: 14px; padding: 0; overflow: hidden; background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }
.leaflet-popup-content { margin: 0; width: 340px !important; max-width: calc(100vw - 60px); max-height: 72vh; overflow-y: auto; font: 13px/1.5 var(--body); }
.leaflet-popup-tip { background: var(--panel); }
.leaflet-container a.leaflet-popup-close-button { color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.6); top: 6px; right: 6px; font-size: 22px; z-index: 5; }
.pop { padding: 14px 16px 14px; }
.pop .tag { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #fff; padding: 2px 8px; border-radius: 999px; }
.pop h2 { font: 800 19px/1.2 var(--display); margin: 8px 0 2px; text-wrap: balance; }
.pop .jpname { color: var(--muted); font-size: 12px; }
.pop .area { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
.pop p { margin: 6px 0; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; margin: 8px 0; font-size: 12.5px; }
.facts dt { color: var(--muted); font-weight: 500; }
.facts dd { margin: 0; }
.links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.links a { font-size: 12px; font-weight: 700; text-decoration: none; color: var(--ink); background: var(--chip); padding: 5px 10px; border-radius: 999px; }
.links a:hover { background: var(--line); }
.src { font-size: 11px; color: var(--muted); margin-top: 8px; }
.src a { color: var(--muted); }
.note { background: #fff5d6; color: #5a4300; border-radius: 8px; padding: 6px 9px; font-size: 12px; margin: 8px 0; }

.gallery { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; background: #222; height: 190px; }
.gallery img { flex: 0 0 100%; width: 100%; height: 190px; object-fit: cover; scroll-snap-align: start; }
.gallery-hint { position: relative; }
.gallery-hint .count { position: absolute; right: 10px; bottom: 8px; background: rgba(0,0,0,.6); color: #fff; font-size: 11px; padding: 2px 7px; border-radius: 999px; pointer-events: none; }
.stars { color: var(--gold); letter-spacing: 2px; font-size: 14px; }
.pc { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0 4px; }
.pc h3 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; margin: 0 0 4px; }
.pc .pros h3 { color: var(--good); }
.pc .cons h3 { color: var(--bad); }
.pc ul { margin: 0; padding-left: 16px; font-size: 12.5px; }
.pc li { margin-bottom: 3px; }
.family { background: var(--chip); border-radius: 8px; padding: 7px 10px; margin: 8px 0; font-size: 12.5px; }
.family b { display: block; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.avail { font-size: 12px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 8px; margin-top: 10px; }

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171b; --panel: #1f2228; --ink: #eceef2; --muted: #a2a9b4; --line: #343841; --chip: #2a2e35;
    --good: #5ccf8d; --bad: #ff8a80; --shadow: 0 8px 28px rgba(0,0,0,.5); --c-h5: #000; color-scheme: dark;
  }
  :root:not([data-theme="light"]) .note { background: #3b3216; color: #f3dc94; }
}
:root[data-theme="dark"] {
  --bg: #15171b; --panel: #1f2228; --ink: #eceef2; --muted: #a2a9b4; --line: #343841; --chip: #2a2e35;
  --good: #5ccf8d; --bad: #ff8a80; --shadow: 0 8px 28px rgba(0,0,0,.5); --c-h5: #000; color-scheme: dark;
}
:root[data-theme="dark"] .note { background: #3b3216; color: #f3dc94; }

/* phones: filter card becomes a bottom sheet behind a button */
@media (max-width: 640px) {
  .panel { top: auto; bottom: max(12px, env(safe-area-inset-bottom, 0px)); left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); width: auto; max-height: 62%; }
  .panel.collapsed { display: none; }
  .toggle-panel { display: block; position: fixed; z-index: 1001; bottom: max(16px, env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%);
    font: 700 14px var(--body); background: var(--ink); color: var(--panel); border: 0; border-radius: 999px; padding: 10px 18px; box-shadow: var(--shadow); }
  .panel:not(.collapsed) ~ .toggle-panel { bottom: calc(62% + 22px); }
}
@media (prefers-reduced-motion: reduce) { .pin { transition: none; } }
</style>
</head>
<body>
<div id="map" aria-label="Map of Tokyo"></div>

<aside class="panel collapsed" id="panel">
  <div class="brand"><h1>Tokyo Trip</h1><span class="jp">東京</span></div>
  <div class="sub" id="subline">Pick an area, tick or untick types, and tap a pin for details.</div>
  <div class="area-pick"><label for="area">Area</label><select id="area"></select></div>
  <div class="area-list" id="area-list" hidden></div>
  <div id="filters"></div>
  <div class="panel-foot">
    <button type="button" id="all-on">Show all</button>
    <button type="button" id="all-off">Hide all</button>
    <div style="margin-top:6px" id="updated"></div>
  </div>
</aside>
<button type="button" class="toggle-panel" id="toggle">Filters</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

o)", "cat": "gaming", "area": "Shibuya (Shibuya PARCO 6F)", "lat": 35.66193, "lng": 139.69899, "why": "Nintendo's official store: Mario, Zelda, Splatoon and Animal Crossing merchandise, giant character statues and game demo stations; Capcom Store with Monster Hunter and Street Fighter is on the same floor.", "ages": "All ages", "tips": "Open 10:00–21:00. Go at 10:00 on weekdays; weekend afternoons can be shoulder to shoulder. Same floor as Pokémon Center Shibuya.", "time_needed": "1 hr", "url": "https://www.nintendo.co.jp/officialstore/en/", "status_note": "", "source": "https://www.timeout.com/tokyo/shopping/pokemon-center-shibuya"}, {"name": "Tokyo Joypolis + Joypolis Sports X", "cat": "gaming", "area": "Odaiba (DECKS Tokyo Beach)", "lat": 35.62872, "lng": 139.7753, "why": "Sega's indoor theme park with VR rides, a half-pipe, indoor coasters and arcades; the new Sports X floor adds XR digital sports games.", "ages": "8–16 (height limits on many rides)", "tips": "Buy a Passport (unlimited rides) online for a small discount. Sports X: weekday 3-hr blocks / weekend 2-hr blocks, ~¥2,900 adult, preschoolers free. Great wet-weather day; Legoland Discovery Centre is in the same mall.", "time_needed": "3–4 hrs", "url": "https://tokyo-joypolis.com/language/english/", "status_note": "NEW: Joypolis Sports X opened 10 Jul 2026 on DECKS Island Mall 5F.", "source": "https://www.moguravr.com/?p=318101"}, {"name": "Super Potato Akihabara", "cat": "gaming", "area": "Akihabara", "lat": 35.69937, "lng": 139.77074, "why": "Legendary retro game shop: shelves of Famicom, Game Boy and N64 games, plus a tiny retro arcade floor with old coin-op machines.", "ages": "8+ (parents will love it too)", "tips": "Narrow, crowded floors, so leave the pram outside. The top-floor arcade takes ¥100 coins. Check Japanese consoles are region-compatible before buying games.", "time_needed": "45 min–1 hr", "url": "https://www.superpotato.com/", "status_note": "", "source": "https://en.akihabara-bc.jp/game-center-list/"}, {"name": "Taito Station Akihabara (and GiGO arcades on Chuo-dori)", "cat": "gaming", "area": "Akihabara (Chuo-dori)", "lat": 35.70024, "lng": 139.77174, "why": "Multi-floor arcade with crane games, rhythm games (Taiko no Tatsujin, maimai) and purikura photo booths; the GiGO arcades are a few doors away.", "ages": "6+", "tips": "Open about 10:00–23:00. By Tokyo rules, under-16s need a parent with them after 18:00 and no under-18s are allowed after 22:00. Change machines on every floor; set a ¥ limit for crane games.", "time_needed": "1 hr", "url": "https://www.taito.co.jp/en/", "status_note": "GiGO Akihabara 1 (the old Sega flagship) closed 31 Aug 2025; GiGO Akihabara 2 and other GiGO branches remain open.", "source": "https://www.siliconera.com/gigo-akihabara-1-arcade-center-will-close-in-august/"}, {"name": "Taito Hey (Akihabara)", "cat": "gaming", "area": "Akihabara", "lat": 35.69905, "lng": 139.77084, "why": "Famous retro and fighting-game arcade: classic shooters and Street Fighter cabinets across four floors.", "ages": "10+", "tips": "Open about 10:00–23:30; same arcade rules (under-16s need a parent after 18:00). Ground floor is cranes; retro games are upstairs.", "time_needed": "45 min", "url": "https://www.taito.co.jp/en/", "status_note": "", "source": "https://www.japan-pop-now.com/articles/gaming-tokyo-2026"}, {"name": "Yodobashi Camera Multimedia Akiba (toy and game floor)", "cat": "gaming", "area": "Akihabara (east exit)", "lat": 35.69878, "lng": 139.77473, "why": "Massive electronics store with a whole floor of video games, Switch accessories, Gunpla, Tomica, Lego and capsule-toy machines.", "ages": "All ages", "tips": "Open 9:30–22:00. Tax-free counter with passport. Good rainy-day stop right next to the station.", "time_needed": "1 hr", "url": "https://www.yodobashi-akiba.com/", "status_note": "", "source": "https://www.yodobashi-akiba.com/"}, {"name": "Kirby Café Tokyo", "cat": "gaming", "area": "Oshiage (Tokyo Solamachi East Yard 4F)", "lat": 35.71037, "lng": 139.8119, "why": "Nintendo's Kirby-themed café: Kirby-shaped food and desserts, plus a Kirby shop you can walk into without booking.", "ages": "3–12", "tips": "Reservations essential and sell out fast; booking-window rules have changed over time, so check the official site a month ahead. The shop next door needs no booking.", "time_needed": "1–1.5 hrs", "url": "https://kirbycafe.jp/", "status_note": "", "source": "https://thirdeyetraveller.com/kirby-cafe-japan-reservation-worth-it/"}, {"name": "Round1 Stadium Odaiba (Spo-Cha)", "cat": "gaming", "area": "Odaiba (DiverCity Tokyo Plaza)", "lat": 35.62462, "lng": 139.77601, "why": "All-you-can-play sports and games: arcades, bowling, batting cages, basketball, archery and more, all on one ticket.", "ages": "6–16 (13+ can go without parents with a signed waiver)", "tips": "Spo-Cha is sold in time packs (90 min, 3 hrs, free time); preschool rates are cheap. Bring indoor shoes or socks. Weekday daytime is quiet.", "time_needed": "2–3 hrs", "url": "https://www.round1.co.jp/shop/tenpo/tokyo-divercity-eng.html", "status_note": "The life-size Unicorn Gundam statue outside DiverCity was removed at the end of Aug 2026.", "source": "https://www.round1.co.jp/shop/tenpo/tokyo-divercity-eng.html"}, {"name": "Tokyo DisneySea (incl. Fantasy Springs)", "cat": "amusement", "area": "Maihama (Chiba)", "lat": 35.62726, "lng": 139.88441, "why": "Often ranked the world's best Disney park; Fantasy Springs has Frozen, Tangled and Peter Pan lands with top-rated rides.", "ages": "4+ (all ages)", "tips": "Date-specific, demand-priced tickets (up to ~¥12,400) via the official site or app; they sell out on peak days. Fantasy Springs rides need a free Standby Pass or paid Premier Access (~¥2,000 per ride) booked in the app on the day, so be in the park at opening.", "time_needed": "Full day", "url": "https://www.tokyodisneyresort.jp/en/tds/", "status_note": "25th anniversary 'Sparkling Jubilee' runs 15 Apr 2026–31 Mar 2027 (extra crowds). Reports say the 'Fantasy Springs Magic' ticket is no longer sold; check the official site.", "source": "https://www.disneytouristblog.com/strategy-guide-entering-fantasy-springs-experiencing-rides-free-versus-paid/"}, {"name": "Tokyo Disneyland", "cat": "amusement", "area": "Maihama (Chiba)", "lat": 35.63266, "lng": 139.88142, "why": "Classic Disney park with Beauty and the Beast, Baymax and Pooh's Hunny Hunt rides and parades; better than DisneySea for younger kids.", "ages": "2–12", "tips": "Date-specific, demand-priced tickets. Use the official app for Premier Access and Standby Passes. Weekdays outside Japanese school holidays are quietest.", "time_needed": "Full day", "url": "https://www.tokyodisneyresort.jp/en/tdl/", "status_note": "Space Mountain is closed and demolished; the new 'Space Mountain Earthrise' and Wreck-It Ralph ride 'Sugar Rush: Sweet Rescue' are due in 2027, so Tomorrowland is partly a building site.", "source": "https://www.ausleisure.com.au/news/tokyo-disneyland-names-new-space-mountain-and-wreck-it-ralph-attractions"}, {"name": "Warner Bros. Studio Tour Tokyo – The Making of Harry Potter", "cat": "amusement", "area": "Nerima (Toshimaen)", "lat": 35.74562, "lng": 139.64575, "why": "Walk through the Great Hall, Diagon Alley, Platform 9¾ and the Hogwarts Express sets, with real costumes and props.", "ages": "7+ (Harry Potter fans)", "tips": "Date and timed-entry tickets only, not sold at the door; adult ~¥6,600–7,300 (date-based pricing since 1 Jul 2026), non-refundable, ¥1,500 per date change. School holidays and weekends sell out. 1 min from Toshimaen Station.", "time_needed": "4 hrs", "url": "https://www.wbstudiotour.jp/en/", "status_note": "Date-based ticket pricing introduced from 1 Jul 2026.", "source": "https://www.japan-travel-kit.com/guides/attractions/warner-bros-studio-tour-tokyo-tickets"}, {"name": "teamLab Planets TOKYO", "cat": "amusement", "area": "Toyosu", "lat": 35.64938, "lng": 139.78973, "why": "Barefoot digital-art museum where you wade through knee-deep water with glowing koi and walk through a room of floating flowers.", "ages": "4+", "tips": "Timed tickets online; book ahead for weekends. You go barefoot and wade in water, so wear shorts or roll-up pants; lockers provided.", "time_needed": "1.5–2 hrs", "url": "https://www.teamlab.art/e/planets/", "status_note": "Scheduled to run until end of 2027.", "source": "https://businesswire.com/news/home/20230830716639/en/As-teamLab-Planets-in-Tokyo-Welcomes-Around-1-Million-Visitors-From-Abroad-in-a-6-Month-Period-the-Immersive-Museum-Unveils-the-Renewal-of-Artwork-Spaces"}, {"name": "teamLab Borderless (Azabudai Hills)", "cat": "amusement", "area": "Azabudai / Kamiyacho", "lat": 35.662, "lng": 139.74342, "why": "Huge maze of moving digital artworks with no set route, plus a Future Park area where kids' own drawings come to life on the walls.", "ages": "4+", "tips": "Timed tickets on the official teamLab site only; no cancel or change once booked. Kamiyacho Station (Hibiya Line) exit 5. Pick either Borderless or Planets if short on time.", "time_needed": "2–3 hrs", "url": "https://www.teamlab.art/e/borderless-azabudai/", "status_note": "", "source": "https://japan.stripes.com/travel/teamlab-borderless-at-azabudai-hills.html"}, {"name": "Ghibli Museum, Mitaka", "cat": "amusement", "area": "Mitaka (Inokashira Park)", "lat": 35.69625, "lng": 139.57045, "why": "Whimsical Studio Ghibli museum with a giant Catbus kids can climb on, a rooftop robot soldier and an exclusive short film.", "ages": "3–12 (Catbus play is for under 12s)", "tips": "Tickets ONLY via Lawson Ticket, released 10:00 JST on the 10th of the month before (noon in Sydney during daylight saving). Name-linked with ID check; no resale. Create the Lawson account beforehand. Ghibli Park (Nagoya) is a separate place.", "time_needed": "2–3 hrs", "url": "https://www.ghibli-museum.jp/en/", "status_note": "", "source": "https://ghibli-museum.jp/en/tickets"}, {"name": "Sanrio Puroland", "cat": "amusement", "area": "Tama Center", "lat": 35.62456, "lng": 139.42945, "why": "Fully indoor Hello Kitty theme park with gentle rides, character meet-and-greets and big musical shows.", "ages": "2–10", "tips": "Buy date tickets online (cheaper than at the gate); weekdays are calmer. Shows are in Japanese but very visual. Good rainy-day option.", "time_needed": "4–5 hrs", "url": "https://en.puroland.jp/", "status_note": "35th anniversary year; Odakyu Tama Center Station was redecorated with 14 Sanrio characters from Feb 2026.", "source": "https://haveagood-holiday.com/en/articles/odakyu-tama-center-station-sanrio-renovation-february-2026"}, {"name": "Tokyo Dome City Attractions", "cat": "amusement", "area": "Suidobashi / Korakuen", "lat": 35.70439, "lng": 139.75422, "why": "Free-entry inner-city amusement park: Thunder Dolphin coaster through a building, a hubless Ferris wheel, and kiddie rides; Asobono indoor play area for under-6s.", "ages": "3–14", "tips": "No entry fee; pay per ride or buy a ride pass. Great for an evening when rides are lit up. Thunder Dolphin has a height limit.", "time_needed": "2–3 hrs", "url": "https://www.tokyo-dome.co.jp/en/tourists/attractions/", "status_note": "", "source": "https://www.tokyo-dome.co.jp/en/tourists/attractions/"}, {"name": "Yomiuriland", "cat": "amusement", "area": "Inagi (western Tokyo)", "lat": 35.62525, "lng": 139.5188, "why": "Big hilltop amusement park with roller coasters, water rides, the Goodjoba!! hands-on factory zone and winter illuminations; PokéPark KANTO is inside it.", "ages": "4–16", "tips": "Every PokéPark ticket includes Yomiuriland entry, so do both on the same day. Take the Sky Shuttle gondola from Keio-Yomiuri-Land Station. Jewellumination night lights run in the cooler months.", "time_needed": "Full day", "url": "https://www.yomiuriland.com/", "status_note": "Much busier since PokéPark KANTO opened in Feb 2026.", "source": "https://www.jrailpass.com/blog/pokepark-kanto-tokyo"}, {"name": "LEGOLAND Discovery Center Tokyo", "cat": "amusement", "area": "Odaiba (DECKS Tokyo Beach)", "lat": 35.62882, "lng": 139.77567, "why": "Indoor Lego world with a Miniland Tokyo model, 4D cinema, three small rides and big build-and-play zones.", "ages": "3–10", "tips": "Buy online for a discount and a time slot (~¥2,300–2,900, varies by date). Adults must come with a child. Same mall as Joypolis.", "time_needed": "2–3 hrs", "url": "https://www.legolanddiscoverycenter.com/tokyo/en/", "status_note": "", "source": "https://www.gotokyo.org/en/spot/468/index.html"}, {"name": "SMALL WORLDS Tokyo", "cat": "amusement", "area": "Ariake", "lat": 35.63783, "lng": 139.78825, "why": "One of the world's largest indoor miniature museums: a working mini airport, space centre and anime worlds (Evangelion, Sailor Moon) with tiny moving details to spot.", "ages": "4+", "tips": "Open about 11:00–20:00 (last entry 19:00); check the official calendar for closed days. Online tickets are cheaper. You can pay to get scanned into a tiny figure that lives in the model.", "time_needed": "2 hrs", "url": "https://smallworlds.jp/en/", "status_note": "", "source": "https://tokyocheapo.com/place/small-worlds-tokyo/"}, {"name": "Asakusa Hanayashiki", "cat": "amusement", "area": "Asakusa", "lat": 35.7155, "lng": 139.79461, "why": "Japan's oldest amusement park (1853): small, retro and charming, with a creaky coaster, haunted house and kiddie rides.", "ages": "2–9", "tips": "Pay entry plus per ride, or a ride pass. Easy add-on to Senso-ji temple, a 5-min walk away.", "time_needed": "1.5–2 hrs", "url": "https://www.hanayashiki.net/", "status_note": "", "source": "https://www.hanayashiki.net/"}, {"name": "Tokyo Skytree", "cat": "amusement", "area": "Oshiage", "lat": 35.71005, "lng": 139.81071, "why": "634 m tower with a glass-floor section and views to Mt Fuji on clear days; the base mall holds Sumida Aquarium, a Pokémon Center and Kirby Café.", "ages": "All ages", "tips": "Buy timed tickets online (cheaper than on the day, and skips the ticket queue). Clear winter mornings give the best Fuji views.", "time_needed": "1–1.5 hrs (half day with the mall)", "url": "https://www.tokyo-skytree.jp/en/", "status_note": "", "source": "https://www.tokyo-skytree.jp/en/"}, {"name": "Ueno Zoo", "cat": "animals", "area": "Ueno Park", "lat": 35.7164, "lng": 139.7711, "why": "Japan's oldest zoo: gorillas, tigers, polar bears, elephants, pygmy hippos and a big aye-aye night house, in the middle of Ueno Park's museums.", "ages": "All ages", "tips": "Closed Mondays. Cheap entry (adults ¥600, under-12s free; ages 13–15 ¥200). Arrive at 9:30 opening in summer before animals go to sleep in the heat.", "time_needed": "3 hrs", "url": "https://www.tokyo-zoo.net/english/ueno/", "status_note": "NO PANDAS: twins Xiao Xiao and Lei Lei returned to China 27 Jan 2026, leaving Japan with no giant pandas for the first time since 1972. No replacement loan confirmed as of late 2026.", "source": "https://english.adnkronos.com/2026/01/27/last-2-pandas-in-japan-leave-for-china/"}, {"name": "Tama Zoological Park", "cat": "animals", "area": "Hino (western Tokyo)", "lat": 35.64867, "lng": 139.40371, "why": "Big hilly zoo with free-roaming feel: Lion Bus that drives through the lion enclosure, orangutans on an overhead sky walk, koalas, and a giant butterfly dome.", "ages": "3+", "tips": "Closed Wednesdays. Very hilly, so bring the pram only if strong legs. Do the Lion Bus early, as the queue grows. Combine with Sanrio Puroland (nearby) on separate days.", "time_needed": "Half to full day", "url": "https://www.tokyo-zoo.net/english/tama/", "status_note": "", "source": "https://www.gotokyo.org/jp/spot/283/index.html"}, {"name": "Sunshine Aquarium", "cat": "animals", "area": "Ikebukuro (Sunshine City rooftop)", "lat": 35.72914, "lng": 139.72027, "why": "Rooftop aquarium where penguins appear to fly over the city skyline, and sea lions swim through a ring tank above your head.", "ages": "All ages", "tips": "Buy online to skip ticket queues; weekends are crowded. Same complex as Pokémon Center Mega Tokyo.", "time_needed": "1.5–2 hrs", "url": "https://sunshinecity.jp/en/aquarium/", "status_note": "The separate Adores Sunshine arcade in the same building closed Jan 2026.", "source": "https://www.gotokyo.org/en/spot/32/index.html"}, {"name": "Maxell Aqua Park Shinagawa", "cat": "animals", "area": "Shinagawa (Shinagawa Prince Hotel)", "lat": 35.62839, "lng": 139.73575, "why": "Dolphin shows with lights and music, a jellyfish room and a shark tunnel, plus a small indoor merry-go-round and pirate-ship ride.", "ages": "All ages", "tips": "Open 10:00–20:00; evening dolphin shows are the most spectacular. 2 min from Shinagawa Station. Adults ~¥2,800.", "time_needed": "2 hrs", "url": "https://www.aqua-park.jp/aqua/en/", "status_note": "", "source": "https://www.gotokyo.org/en/spot/294/index.html"}, {"name": "Sumida Aquarium", "cat": "animals", "area": "Oshiage (Tokyo Solamachi West Yard 5F)", "lat": 35.7101, "lng": 139.80933, "why": "Modern indoor aquarium with an open-top penguin and fur-seal pool you look down into, and a big glowing jellyfish lab.", "ages": "All ages", "tips": "Buy timed tickets online. Combine with Skytree, Pokémon Center and Kirby Café in the same complex.", "time_needed": "1.5 hrs", "url": "https://www.sumida-aquarium.com/en/", "status_note": "", "source": "https://japan.stripes.com/travel/top-must-visit-aquariums-in-tokyo-and-nearby-areas.html"}, {"name": "Tokyo Sea Life Park (Kasai Rinkai)", "cat": "animals", "area": "Kasai Rinkai Park", "lat": 35.64066, "lng": 139.86205, "why": "Huge doughnut tank of tuna swimming in circles, a penguin colony and a seaside park with a giant Ferris wheel next door.", "ages": "All ages", "tips": "Closed Wednesdays. Very cheap (adults ~¥700, under-12s free). One stop from Maihama, so it pairs with a Disney trip.", "time_needed": "2 hrs (half day with the park)", "url": "https://www.tokyo-zoo.net/english/kasai/", "status_note": "A new aquarium is being built next door (targeted around 2028); the old one stays open meanwhile, with some tanks closed for works at times.", "source": "https://www.timeout.jp/tokyo/ja/news/kasai-rinkai-acarium-park-renewal-021023"}, {"name": "Yokohama Hakkeijima Sea Paradise", "cat": "animals", "area": "Yokohama (Kanazawa-ku)", "lat": 35.3365, "lng": 139.64578, "why": "Island combining four aquariums (walrus, polar bears, dolphins, belugas) with an amusement park and a sea-drop coaster.", "ages": "3+", "tips": "About 1 hr from central Tokyo. Buy the One Day Pass if you want aquariums plus rides. The 'Fureai Lagoon' lets kids get close to dolphins and penguins.", "time_needed": "Full day", "url": "https://www.seaparadise.co.jp/english/", "status_note": "", "source": "https://japan.stripes.com/travel/top-must-visit-aquariums-in-tokyo-and-nearby-areas.html"}, {"name": "Zoorasia (Yokohama Zoological Gardens)", "cat": "animals", "area": "Yokohama (Asahi-ku)", "lat": 35.49511, "lng": 139.52766, "why": "One of Japan's best modern zoos, with spacious habitat zones and rare animals such as okapi, red river hogs and proboscis monkeys.", "ages": "3+", "tips": "Closed Tuesdays. Long day trip: bus from Nakayama or Tsurugamine Station. Cheap entry; under-school-age kids free.", "time_needed": "Half day", "url": "https://www.hama-midorinokyokai.or.jp/zoo/zoorasia/english/", "status_note": "", "source": "https://www.hama-midorinokyokai.or.jp/zoo/zoorasia/english/"}, {"name": "Kawa-Suku Kawasaki Aquarium", "cat": "animals", "area": "Kawasaki (Kawasaki Le Front 9–10F)", "lat": 35.52929, "lng": 139.69684, "why": "River and rainforest aquarium inside a shopping mall: piranhas, arapaima, sloths and capybaras you can see up close.", "ages": "2–10", "tips": "Right next to JR Kawasaki Station (18 min from Shinagawa). Indoor and compact, so it suits a rainy morning.", "time_needed": "1.5 hrs", "url": "https://kawa-suku.com/", "status_note": "", "source": "https://japan.stripes.c       { key: 'hotel5', icon: 'hotel', label: '5-star hotels', color: 'var(--c-h5)' },
      { key: 'hotel4', icon: 'hotel', label: '4-star hotels', color: 'var(--c-h4)' } ] }
  ];
  const SUB = {};
  GROUPS.forEach(g => g.subs.forEach(s => { s.group = g.key; s.icon = s.icon || s.key; SUB[s.key] = s; }));

  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const gmaps = p => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(p.name + ' ' + (p.area || '') + ' Tokyo');

  // ---- map + basemap that follows light/dark ----
  const map = L.map('map', { zoomControl: false, worldCopyJump: false }).setView([35.676, 139.73], 12);
  L.control.zoom({ position: 'topright' }).addTo(map);
  const dark = matchMedia('(prefers-color-scheme: dark)');
  // Esri plain grey map (water, parks, main roads, place names): simple, and works when opened straight from a file
  const ESRI = 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/';
  const tileOpts = { maxZoom: 19, maxNativeZoom: 16, referrerPolicy: 'no-referrer' };
  let base, labels;
  function setTiles() {
    const theme = document.documentElement.dataset.theme;
    const tone = (theme ? theme === 'dark' : dark.matches) ? 'Dark' : 'Light';
    if (base) { map.removeLayer(base); map.removeLayer(labels); }
    base = L.tileLayer(ESRI + 'World_' + tone + '_Gray_Base/MapServer/tile/{z}/{y}/{x}',
      Object.assign({ attribution: 'Tiles &copy; Esri &mdash; Esri, HERE, Garmin, &copy; OpenStreetMap contributors' }, tileOpts)).addTo(map);
    labels = L.tileLayer(ESRI + 'World_' + tone + '_Gray_Reference/MapServer/tile/{z}/{y}/{x}', tileOpts).addTo(map);
  }
  setTiles();
  dark.addEventListener && dark.addEventListener('change', setTiles);

  // ---- popups ----
  function hotelPopup(p) {
    const photos = (p.photos || []).filter(Boolean);
    const gallery = photos.length ? '<div class="gallery-hint"><div class="gallery">' +
      photos.map(u => '<img loading="lazy" src="' + esc(u) + '" alt="' + esc(p.name) + '" referrerpolicy="no-referrer" onerror="this.remove()">').join('') +
      '</div>' + (photos.length > 1 ? '<span class="count">' + photos.length + ' photos · swipe</span>' : '') + '</div>' : '';
    const li = a => (a || []).map(x => '<li>' + esc(x) + '</li>').join('');
    return gallery + '<div class="pop">' +
      '<span class="stars">' + '★'.repeat(p.stars || 0) + '</span>' +
      '<h2>' + esc(p.name) + '</h2><div class="area">' + esc(p.area) + (p.style ? ' · ' + esc(p.style) : '') + '</div>' +
      (p.family_option ? '<div class="family"><b>Family option</b>' + esc(p.family_option) + '</div>' : '') +
      (p.price_guide ? '<dl class="facts"><dt>Price guide</dt><dd>' + esc(p.price_guide) + '</dd></dl>' : '') +
      '<div class="pc"><div class="pros"><h3>Pros</h3><ul>' + li(p.pros) + '</ul></div><div class="cons"><h3>Cons</h3><ul>' + li(p.cons) + '</ul></div></div>' +
      '<div class="links">' + (p.url ? '<a href="' + esc(p.url) + '" target="_blank" rel="noopener">Hotel website</a>' : '') +
      '<a href="' + gmaps(p) + '" target="_blank" rel="noopener">Google Maps</a></div>' +
      '<div class="avail">Availability: ' + esc(p.availability || 'to be checked once trip dates are set.') + '</div></div>';
  }
  // food entries name a publication; kids entries carry only the page they came from
  function srcLink(p) {
    if (/^https?:/.test(p.source)) {
      let host = p.source; try { host = new URL(p.source).hostname.replace(/^www\./, ''); } catch (e) {}
      return 'Source: <a href="' + esc(p.source) + '" target="_blank" rel="noopener">' + esc(host) + '</a>';
    }
    return 'Recommended by: ' + (p.source_url ? '<a href="' + esc(p.source_url) + '" target="_blank" rel="noopener">' + esc(p.source) + '</a>' : esc(p.source));
  }
  function placePopup(p) {
    const s = SUB[p.cat];
    const rows = [];
    const add = (k, v) => { if (v) rows.push('<dt>' + k + '</dt><dd>' + esc(v) + '</dd>'); };
    add('Best for', p.ages); add('Time', p.time_needed); add('Price', p.price); add('Kids', p.kids); add('Hours', p.hours); add('Booking', p.booking); add('Tips', p.tips);
    return '<div class="pop">' +
      '<span class="tag" style="background:' + s.color + '">' + esc(s.label) + '</span>' +
      '<h2>' + esc(p.name) + '</h2>' + (p.name_jp ? '<div class="jpname">' + esc(p.name_jp) + '</div>' : '') +
      '<div class="area">' + esc(p.area) + '</div>' +
      '<p>' + esc(p.why) + '</p>' +
      (p.status_note ? '<div class="note">' + esc(p.status_note) + '</div>' : '') +
      (rows.length ? '<dl class="facts">' + rows.join('') + '</dl>' : '') +
      '<div class="links">' + (p.url ? '<a href="' + esc(p.url) + '" target="_blank" rel="noopener">Website</a>' : '') +
      '<a href="' + gmaps(p) + '" target="_blank" rel="noopener">Google Maps</a></div>' +
      (p.source ? '<div class="src">' + srcLink(p) + '</div>' : '') +
      '</div>';
  }

  // ---- areas: every place belongs to the nearest neighbourhood centre ----
  const AREAS = [
    { key: 'akasaka', label: 'Akasaka & Nagatacho', c: [35.6740, 139.7370] },
    { key: 'akihabara', label: 'Akihabara', c: [35.6995, 139.7715] },
    { key: 'asakusa', label: 'Asakusa & Skytree', c: [35.7110, 139.8000] },
    { key: 'ebisu', label: 'Ebisu & Nakameguro', c: [35.6440, 139.7040] },
    { key: 'ginza', label: 'Ginza', c: [35.6717, 139.7650] },
    { key: 'harajuku', label: 'Harajuku & Omotesando', c: [35.6690, 139.7080] },
    { key: 'ikebukuro', label: 'Ikebukuro', c: [35.7295, 139.7160] },
    { key: 'kichijoji', label: 'Kichijoji & Mitaka', c: [35.7020, 139.5750] },
    { key: 'kiyosumi', label: 'Kiyosumi & Ryogoku', c: [35.6850, 139.7980] },
    { key: 'maihama', label: 'Maihama & Kasai (Disney)', c: [35.6400, 139.8750] },
    { key: 'marunouchi', label: 'Marunouchi & Tokyo Station', c: [35.6812, 139.7671] },
    { key: 'nihonbashi', label: 'Nihonbashi', c: [35.6840, 139.7745] },
    { key: 'odaiba', label: 'Odaiba & Toyosu', c: [35.6330, 139.7800] },
    { key: 'roppongi', label: 'Roppongi & Azabu', c: [35.6590, 139.7300] },
    { key: 'shibuya', label: 'Shibuya', c: [35.6595, 139.7005] },
    { key: 'shimokita', label: 'Shimokitazawa', c: [35.6610, 139.6680] },
    { key: 'shinagawa', label: 'Shinagawa', c: [35.6285, 139.7387] },
    { key: 'shinjuku', label: 'Shinjuku', c: [35.6900, 139.7000] },
    { key: 'toranomon', label: 'Toranomon & Kamiyacho', c: [35.6660, 139.7460] },
    { key: 'ueno', label: 'Ueno & Yanaka', c: [35.7140, 139.7740] },
    { key: 'yoyogi', label: 'Yoyogi & Tomigaya', c: [35.6680, 139.6900] }
  ];
  const FURTHER = { key: 'further', label: 'Further out (day trips)' };
  const AREA_BY_KEY = {}; [...AREAS, FURTHER].forEach(a => AREA_BY_KEY[a.key] = a);
  function areaOf(lat, lng) {
    let best = FURTHER, bd = 2.6; // km; anything further from every centre is a day trip
    AREAS.forEach(a => { const d = Math.hypot((lat - a.c[0]) * 111, (lng - a.c[1]) * 90.4); if (d < bd) { bd = d; best = a; } });
    return best.key;
  }

  // ---- one entry per pin: marker, sub-filter, area ----
  const D = window.TRIP_DATA || { places: [], hotels: [] };
  const entries = [];
  function pinIcon(s, extra) {
    return L.divIcon({ className: '', iconSize: extra === 'hotel' ? [34, 34] : [28, 28],
      html: '<div class="pin ' + (extra || '') + '" style="background:' + s.color + '">' + ICON[s.icon] + '</div>' });
  }
  D.places.forEach(p => {
    const s = SUB[p.cat]; if (!s || p.lat == null) return;
    const marker = L.marker([p.lat, p.lng], { icon: pinIcon(s), title: p.name, riseOnHover: true })
      .bindPopup(placePopup(p), { maxWidth: 360, autoPanPadding: [20, 60] });
    entries.push({ marker, sub: p.cat, area: areaOf(p.lat, p.lng), name: p.name });
  });
  D.hotels.forEach(h => {
    const k = h.stars >= 5 ? 'hotel5' : 'hotel4', s = SUB[k]; if (h.lat == null) return;
    const marker = L.marker([h.lat, h.lng], { icon: pinIcon(s, 'hotel' + (h.fav ? ' fav' : '')), title: h.name, riseOnHover: true, zIndexOffset: 500 })
      .bindPopup(hotelPopup(h), { maxWidth: 360, autoPanPadding: [20, 60] });
    entries.push({ marker, sub: k, area: areaOf(h.lat, h.lng), name: h.name });
  });

  // ---- state (remembered per viewer) ----
  const STORE = 'tokyo-trip-filters';
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(STORE) || '{}'); } catch (e) { saved = {}; }
  const on = {}; Object.keys(SUB).forEach(k => on[k] = saved[k] !== undefined ? saved[k] : true);
  let area = AREA_BY_KEY[saved.area] ? saved.area : 'all';
  function save() { try { localStorage.setItem(STORE, JSON.stringify(Object.assign({ area }, on))); } catch (e) {} }

  // ---- filter UI ----
  const box = document.getElementById('filters');
  GROUPS.forEach(g => {
    const el = document.createElement('div'); el.className = 'group';
    el.innerHTML = '<label class="group-head"><input type="checkbox" id="g-' + g.key + '"> ' + g.label + '<span class="count" id="c-' + g.key + '"></span></label>' +
      '<div class="subs">' + g.subs.map(s =>
        '<label><input type="checkbox" id="f-' + s.key + '">' +
        '<span class="dot" style="background:' + s.color + '">' + ICON[s.icon] + '</span>' + s.label +
        '<span class="count" id="c-' + s.key + '"></span></label>').join('') + '</div>';
    box.appendChild(el);
  });
  const areaSel = document.getElementById('area'), areaList = document.getElementById('area-list');
  const inArea = e => area === 'all' || e.area === area;
  const areaCount = k => entries.filter(e => k === 'all' || e.area === k).length;
  areaSel.innerHTML = '<option value="all">All of Tokyo (' + entries.length + ')</option>' +
    [...AREAS, FURTHER].filter(a => areaCount(a.key)).map(a => '<option value="' + a.key + '">' + a.label + ' (' + areaCount(a.key) + ')</option>').join('');
  areaSel.value = area;

  // kids + food pins share one cluster group (number bubbles when zoomed out); hotels always stand alone
  const cluster = L.markerClusterGroup({ showCoverageOnHover: false, maxClusterRadius: 45, disableClusteringAtZoom: 15,
    iconCreateFunction: c => L.divIcon({ className: '', iconSize: [38, 38], html: '<div class="cluster">' + c.getChildCount() + '</div>' }) }).addTo(map);
  const stay = L.layerGroup().addTo(map);

  function refresh() {
    cluster.clearLayers(); stay.clearLayers();
    const vis = entries.filter(e => on[e.sub] && inArea(e));
    cluster.addLayers(vis.filter(e => SUB[e.sub].group !== 'stay').map(e => e.marker));
    vis.filter(e => SUB[e.sub].group === 'stay').forEach(e => stay.addLayer(e.marker));
    // counts show what the chosen area holds
    GROUPS.forEach(g => {
      let n = 0, ticked = 0;
      g.subs.forEach(s => {
        const c = entries.filter(e => e.sub === s.key && inArea(e)).length; n += c;
        document.getElementById('c-' + s.key).textContent = c;
        document.getElementById('f-' + s.key).checked = on[s.key]; if (on[s.key]) ticked++;
      });
      document.getElementById('c-' + g.key).textContent = n;
      const gc = document.getElementById('g-' + g.key);
      gc.checked = ticked === g.subs.length; gc.indeterminate = ticked > 0 && ticked < g.subs.length;
    });
    renderList(vis);
    save();
  }

  // list of what is in the chosen area, by type; tap a name to open its pin
  function renderList(vis) {
    areaList.hidden = area === 'all';
    if (area === 'all') return;
    areaList.innerHTML = '';
    if (!vis.length) { areaList.innerHTML = '<div class="empty">Nothing ticked in this area. Tick more types below.</div>'; return; }
    GROUPS.forEach(g => g.subs.forEach(s => {
      const items = vis.filter(e => e.sub === s.key);
      if (!items.length) return;
      const h = document.createElement('h4'); h.textContent = s.label; areaList.appendChild(h);
      items.forEach(e => {
        const b = document.createElement('button'); b.type = 'button';
        b.innerHTML = '<span class="dot" style="background:' + s.color + '">' + ICON[s.icon] + '</span>' + esc(e.name);
        b.onclick = () => openEntry(e);
        areaList.appendChild(b);
      });
    }));
  }
  function openEntry(e) {
    if (matchMedia('(max-width: 640px)').matches) { panel.classList.add('collapsed'); tog.textContent = 'Filters'; }
    // jump (no animation) to a zoom where pins are never grouped, then open the pop-up
    map.setView(e.marker.getLatLng(), Math.max(map.getZoom(), 16), { animate: false });
    e.marker.openPopup();
  }
  function fitArea() {
    let pts = entries.filter(e => inArea(e) && on[e.sub]);
    if (!pts.length) pts = entries.filter(inArea);
    if (area === 'all') pts = pts.filter(e => { const p = e.marker.getLatLng(); return p.lat > 35.55 && p.lat < 35.8 && p.lng > 139.55 && p.lng < 139.95; });
    if (pts.length) map.fitBounds(L.latLngBounds(pts.map(e => e.marker.getLatLng())), { padding: [50, 50], maxZoom: 16, animate: false });
  }

  Object.keys(SUB).forEach(k => document.getElementById('f-' + k).addEventListener('change', ev => { on[k] = ev.target.checked; refresh(); }));
  GROUPS.forEach(g => document.getElementById('g-' + g.key).addEventListener('change', ev => {
    g.subs.forEach(s => on[s.key] = ev.target.checked); refresh();
  }));
  document.getElementById('all-on').onclick = () => { Object.keys(SUB).forEach(k => on[k] = true); refresh(); };
  document.getElementById('all-off').onclick = () => { Object.keys(SUB).forEach(k => on[k] = false); refresh(); };
  areaSel.addEventListener('change', () => { area = areaSel.value; refresh(); fitArea(); });
  if (D.updated) document.getElementById('updated').textContent = 'Research updated ' + D.updated + '.';

  // ---- panel open/closed (closed by default on phones only) ----
  const panel = document.getElementById('panel'), tog = document.getElementById('toggle');
  if (!matchMedia('(max-width: 640px)').matches) panel.classList.remove('collapsed');
  tog.onclick = () => { panel.classList.toggle('collapsed'); tog.textContent = panel.classList.contains('collapsed') ? 'Filters' : 'Close'; };

  refresh();
  fitArea();
})();
</script>
</body>
</html>
